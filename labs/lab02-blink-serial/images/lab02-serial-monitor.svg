<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">Serial Monitor</title><desc id="d">หน้าจอ Serial Monitor แสดงข้อความ Blink และคำสั่ง LED</desc><rect width="1000" height="500" fill="#edf6f7"/><text x="500" y="48" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700">Serial Monitor — 115200 baud</text><rect x="70" y="85" width="860" height="340" rx="12" fill="#17202a"/><g fill="#d9e2ec" font-family="monospace" font-size="23"><text x="105" y="135">[CMD] LED=OFF</text><text x="105" y="175">[CMD] พิมพ์ on, off, toggle หรือ status</text><text x="105" y="230" fill="#7ed6a5">&gt; on</text><text x="105" y="270">[CMD] LED=ON</text><text x="105" y="325" fill="#7ed6a5">&gt; toggle</text><text x="105" y="365">[CMD] LED=OFF</text></g><rect x="700" y="440" width="230" height="42" rx="8" fill="#d9f2ec"/><text x="815" y="468" text-anchor="middle" font-family="sans-serif" font-size="20">New Line • 115200 baud</text></svg>
