  <line x1="245" y1="205" x2="340" y2="205" stroke="#111827" stroke-width="5"/>
  <rect x="340" y="180" width="130" height="50" fill="#fde68a" stroke="#92400e" stroke-width="3"/><text x="405" y="213" text-anchor="middle" font-family="sans-serif" font-size="21">R1 1kΩ</text>
