<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <rect width="900" height="420" fill="#fff"/>
  <text x="450" y="42" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Relay 2CH: ขั้วควบคุมและหน้าสัมผัส</text>
  <rect x="55" y="85" width="260" height="270" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="185" y="120" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#1e3a8a">ด้านควบคุม</text>
  <g font-family="monospace" font-size="21" fill="#0f172a"><text x="90" y="175">VCC → 5V</text><text x="90" y="220">GND → GND</text><text x="90" y="265">IN1 → GPIO16</text><text x="90" y="310">IN2 → GPIO17</text></g>
  <rect x="380" y="85" width="465" height="270" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="612" y="120" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#14532d">หน้าสัมผัส CH1 / CH2</text>
  <circle cx="470" cy="235" r="25" fill="#fff" stroke="#334155" stroke-width="3"/><circle cx="615" cy="180" r="25" fill="#fff" stroke="#334155" stroke-width="3"/><circle cx="760" cy="280" r="25" fill="#fff" stroke="#334155" stroke-width="3"/>
  <line x1="492" y1="224" x2="590" y2="188" stroke="#dc2626" stroke-width="7"/>
  <g text-anchor="middle" font-family="sans-serif" font-size="22" fill="#0f172a"><text x="470" y="290">COM</text><text x="615" y="145">NC</text><text x="760" y="335">NO</text></g>
  <text x="612" y="385" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#b91c1c">แล็บนี้ใช้โหลด DC แรงดันต่ำเท่านั้น — ห้ามต่อ AC 220V</text>
</svg>
