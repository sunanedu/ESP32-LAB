<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="510" viewBox="0 0 1250 510" role="img" aria-labelledby="t d"><title id="t">โหลด LED DC ผ่าน Relay</title><desc id="d">แหล่งจ่ายโหลดบวก5V ผ่าน COM NO ตัวต้านทาน LED แล้วกลับลบ โดยไม่ต่อไฟ AC</desc><rect width="1250" height="510" fill="white"/><g font-family="Segoe UI,Noto Sans Thai,sans-serif" fill="#17202a"><text x="625" y="43" text-anchor="middle" font-size="29" font-weight="bold">หน้าสัมผัสคือสวิตช์ ไม่ใช่ขาจ่ายไฟให้โหลด</text><rect x="55" y="135" width="190" height="245" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="150" y="185" text-anchor="middle" font-size="24">แหล่งจ่าย DC</text><text x="150" y="225" text-anchor="middle" font-size="22">5V สำหรับ LED</text><text x="210" y="280" font-size="22">+</text><text x="210" y="350" font-size="22">−</text><path d="M245 275 H420 M520 275 H650 M790 275 H900 M1035 275 H1130 V345 H245" fill="none" stroke="#334155" stroke-width="5"/><circle cx="420" cy="275" r="8"/><circle cx="520" cy="275" r="8"/><path d="M420 275 L505 230" stroke="#d97706" stroke-width="5"/><text x="420" y="315" text-anchor="middle" font-size="21">COM</text><text x="520" y="315" text-anchor="middle" font-size="21">NO</text><rect x="650" y="250" width="140" height="50" fill="#fef3c7" stroke="#92400e" stroke-width="3"/><text x="720" y="283" text-anchor="middle" font-size="22">R 220Ω</text><rect x="900" y="250" width="135" height="50" rx="20" fill="#fecaca" stroke="#b91c1c" stroke-width="3"/><text x="967" y="283" text-anchor="middle" font-size="21">LED + / −</text><text x="470" y="180" text-anchor="middle" font-size="21">Relay ปิดหน้าสัมผัสเมื่อ ON</text><text x="625" y="435" text-anchor="middle" font-size="22">NC เว้นไว้ • ห้ามใช้ AC 220V • ถอดไฟก่อนแก้สาย</text><text x="625" y="480" text-anchor="middle" font-size="18">ภาพเฉพาะวงจรโหลด DC; วงจร coil/input ต้องต่อและตรวจลอจิก 3.3V ตามโมดูลจริงต่างหาก</text></g></svg>
