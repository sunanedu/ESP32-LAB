<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150" role="img">
<title>LAB 08.1 | ESP32-S3 → DHT11</title><desc>ตรวจอุณหภูมิและความชื้น: DATA4 / VCC3V3 / GND • เลือกโมดูลรองรับ 3.3V</desc>
<rect width="1600" height="1150" fill="#fff"/>
<g font-family="Tahoma,Segoe UI,sans-serif">
<rect x="40" y="30" width="1520" height="132" rx="18" fill="#eef5fb" stroke="none" stroke-width="2"/>
<text x="75" y="87" font-size="36" fill="#17283f" text-anchor="start" font-weight="bold">LAB 08.1 | ESP32-S3 → DHT11</text>
<text x="75" y="132" font-size="23" fill="#52647a" text-anchor="start" font-weight="normal">ตรวจอุณหภูมิและความชื้น: DATA4 / VCC3V3 / GND • เลือกโมดูลรองรับ 3.3V</text>
<text x="65" y="1118" font-size="23" fill="#52647a" text-anchor="start" font-weight="normal">อ่านชื่อ GPIO/สกรีนบนอุปกรณ์จริง • ภาพเป็นผังการเชื่อมต่อ ไม่ใช่ตำแหน่งขาบน header</text>
<rect x="75" y="230" width="350" height="640" rx="12" fill="#edf4fb" stroke="#bccbdb" stroke-width="2"/>
<text x="97" y="272" font-size="28" fill="#17283f" text-anchor="start" font-weight="bold">ESP32-S3</text>
<text x="97" y="306" font-size="21" fill="#52647a" text-anchor="start" font-weight="normal">พินตาม Lab07</text>
<rect x="99" y="330" width="122" height="75" rx="5" fill="#c8d4df" stroke="#8c9eaf" stroke-width="2"/>
<text x="160" y="375" font-size="21" fill="#17283f" text-anchor="middle" font-weight="normal">S3</text>
<rect x="99" y="805" width="82" height="42" rx="4" fill="#d1dce6" stroke="#8c9eaf" stroke-width="2"/>
<text x="140" y="833" font-size="20" fill="#17283f" text-anchor="middle" font-weight="normal">USB</text>
<rect x="1095" y="230" width="435" height="640" rx="12" fill="#eff7ff" stroke="#bccbdb" stroke-width="2"/>
<text x="1117" y="272" font-size="28" fill="#17283f" text-anchor="start" font-weight="bold">DHT11 โมดูล 3 พิน</text>
<text x="1117" y="306" font-size="21" fill="#52647a" text-anchor="start" font-weight="normal">อ่านชื่อพินจริง VCC/DATA/GND</text>
<text x="405" y="428" font-size="26" fill="#17283f" text-anchor="end" font-weight="bold">3V3</text>
<text x="1115" y="428" font-size="26" fill="#17283f" text-anchor="start" font-weight="bold">VCC / +</text>
<polyline points="425,420 1095,420" fill="none" stroke="#d76a12" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="425" cy="420" r="6" fill="#d76a12"/>
<circle cx="1095" cy="420" r="6" fill="#d76a12"/>
<text x="405" y="588" font-size="26" fill="#17283f" text-anchor="end" font-weight="bold">GPIO4</text>
<text x="1115" y="588" font-size="26" fill="#17283f" text-anchor="start" font-weight="bold">DATA / S / OUT</text>
<polyline points="425,580 1095,580" fill="none" stroke="#1769cb" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="425" cy="580" r="6" fill="#1769cb"/>
<circle cx="1095" cy="580" r="6" fill="#1769cb"/>
<text x="405" y="768" font-size="26" fill="#17283f" text-anchor="end" font-weight="bold">GND</text>
<text x="1115" y="768" font-size="26" fill="#17283f" text-anchor="start" font-weight="bold">GND / −</text>
<polyline points="425,760 1095,760" fill="none" stroke="#293544" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="425" cy="760" r="6" fill="#293544"/>
<circle cx="1095" cy="760" r="6" fill="#293544"/>
<rect x="65" y="945" width="1470" height="140" rx="12" fill="#f6f9fc" stroke="#dce6ef" stroke-width="2"/>
<text x="88" y="980" font-size="23" fill="#17283f" text-anchor="start" font-weight="normal">ถ้าไม่มี pull-up ในตัว: ต่อ R10kΩ ระหว่าง DATA กับ 3V3 ไม่ต่อ R อนุกรมกับ DATA</text>
<text x="88" y="1016" font-size="23" fill="#17283f" text-anchor="start" font-weight="normal">แบบเปล่า 4 ขา: มองหน้าตะแกรง ขาชี้ลง 1 VCC / 2 DATA / 3 NC ไม่ต่อ / 4 GND</text>
<text x="88" y="1052" font-size="23" fill="#17283f" text-anchor="start" font-weight="normal">อ่านทุก 2 วินาที; READ FAILED คืออ่านไม่ได้ ไม่ใช่อุณหภูมิ 0°C; ห้ามดึง DATA ขึ้น 5V</text>
</g></svg>