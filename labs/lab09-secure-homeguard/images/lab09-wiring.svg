<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150" role="img">
<title>LAB 09 | ESP32-S3 — ต่อพินเดิม</title><desc>OLED SH1106G / DHT11 / Relay2CH / ปุ่มโมดูล • หมายเลข GPIO ไม่ใช่ตำแหน่ง header</desc>
<rect width="1600" height="1150" fill="#fff"/>
<g font-family="Tahoma,Segoe UI,sans-serif">
<rect x="40" y="30" width="1520" height="132" rx="18" fill="#eef5fb" stroke="none" stroke-width="2"/>
<text x="75" y="87" font-size="36" fill="#17283f" text-anchor="start" font-weight="bold">LAB 09 | ESP32-S3 — ต่อพินเดิม</text>
<text x="75" y="132" font-size="23" fill="#52647a" text-anchor="start" font-weight="normal">OLED SH1106G / DHT11 / Relay2CH / ปุ่มโมดูล • หมายเลข GPIO ไม่ใช่ตำแหน่ง header</text>
<text x="65" y="1118" font-size="23" fill="#52647a" text-anchor="start" font-weight="normal">อ่านชื่อ GPIO/สกรีนบนอุปกรณ์จริง • ภาพเป็นผังการเชื่อมต่อ ไม่ใช่ตำแหน่งขาบน header</text>
<rect x="75" y="230" width="350" height="650" rx="12" fill="#edf4fb" stroke="#bccbdb" stroke-width="2"/>
<text x="97" y="272" font-size="28" fill="#17283f" text-anchor="start" font-weight="bold">ESP32-S3</text>
<text x="97" y="306" font-size="21" fill="#52647a" text-anchor="start" font-weight="normal">พินตาม Lab07</text>
<rect x="99" y="330" width="122" height="75" rx="5" fill="#c8d4df" stroke="#8c9eaf" stroke-width="2"/>
<text x="160" y="375" font-size="21" fill="#17283f" text-anchor="middle" font-weight="normal">S3</text>
<rect x="99" y="815" width="82" height="42" rx="4" fill="#d1dce6" stroke="#8c9eaf" stroke-width="2"/>
<text x="140" y="843" font-size="20" fill="#17283f" text-anchor="middle" font-weight="normal">USB</text>
<rect x="1095" y="230" width="435" height="650" rx="12" fill="#f6f9fc" stroke="#bccbdb" stroke-width="2"/>
<text x="1117" y="272" font-size="28" fill="#17283f" text-anchor="start" font-weight="bold">พินปลายทาง</text>
<text x="1117" y="306" font-size="21" fill="#52647a" text-anchor="start" font-weight="normal">ตรวจสกรีนแต่ละโมดูลก่อนต่อ</text>
<text x="405" y="358" font-size="26" fill="#17283f" text-anchor="end" font-weight="bold">3V3</text>
<text x="1115" y="358" font-size="26" fill="#17283f" text-anchor="start" font-weight="bold">OLED VCC</text>
