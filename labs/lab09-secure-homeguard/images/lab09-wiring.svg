<text x="405" y="726" font-size="26" fill="#17283f" text-anchor="end" font-weight="bold">3V3</text>
<text x="1115" y="726" font-size="26" fill="#17283f" text-anchor="start" font-weight="bold">DHT / Button VCC</text>
<polyline points="425,718 1095,718" fill="none" stroke="#d76a12" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
