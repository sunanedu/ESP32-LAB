<text x="1115" y="772" font-size="26" fill="#17283f" text-anchor="start" font-weight="bold">DHT/Button/Relay GND</text>
<polyline points="425,764 1095,764" fill="none" stroke="#293544" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="425" cy="764" r="6" fill="#293544"/>
<circle cx="1095" cy="764" r="6" fill="#293544"/>
<text x="405" y="818" font-size="26" fill="#17283f" text-anchor="end" font-weight="bold">5V supply</text>
<text x="1115" y="818" font-size="26" fill="#17283f" text-anchor="start" font-weight="bold">Relay VCC</text>
<polyline points="425,810 1095,810" fill="none" stroke="#d83a42" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="425" cy="810" r="6" fill="#d83a42"/>
<circle cx="1095" cy="810" r="6" fill="#d83a42"/>
<rect x="65" y="945" width="1470" height="140" rx="12" fill="#f6f9fc" stroke="#dce6ef" stroke-width="2"/>
<text x="88" y="980" font-size="23" fill="#17283f" text-anchor="start" font-weight="normal">ปุ่มมี R bias ในโมดูล ใช้ INPUT; DHT DATA ต้องมี pull-up10kΩ ถ้าโมดูลไม่มี</text>
<text x="88" y="1016" font-size="23" fill="#17283f" text-anchor="start" font-weight="normal">Relay ต้องรับลอจิก3.3V ต่อ GND ร่วมและใช้แหล่ง5Vตามคู่มือ ไม่ป้อนไฟย้อนบอร์ด USB</text>
<text x="88" y="1052" font-size="23" fill="#17283f" text-anchor="start" font-weight="normal">preflight คง Relay OFF; ถอดโหลดก่อนทดสอบ ใช้เฉพาะโหลด DC แรงดันต่ำ ห้าม AC220V</text>
</g></svg>