<circle cx="425" cy="488" r="6" fill="#8555b5"/>
<circle cx="1095" cy="488" r="6" fill="#8555b5"/>
<text x="405" y="542" font-size="26" fill="#17283f" text-anchor="end" font-weight="bold">GPIO4</text>
<text x="1115" y="542" font-size="26" fill="#17283f" text-anchor="start" font-weight="bold">DHT11 DATA</text>
<polyline points="425,534 1095,534" fill="none" stroke="#1769cb" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="425" cy="534" r="6" fill="#1769cb"/>
<circle cx="1095" cy="534" r="6" fill="#1769cb"/>
