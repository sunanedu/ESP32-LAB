<text x="1115" y="588" font-size="26" fill="#17283f" text-anchor="start" font-weight="bold">Relay IN1</text>
<polyline points="425,580 1095,580" fill="none" stroke="#008575" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="425" cy="580" r="6" fill="#008575"/>
<circle cx="1095" cy="580" r="6" fill="#008575"/>
<text x="405" y="634" font-size="26" fill="#17283f" text-anchor="end" font-weight="bold">GPIO17</text>
<text x="1115" y="634" font-size="26" fill="#17283f" text-anchor="start" font-weight="bold">Relay IN2</text>
<polyline points="425,626 1095,626" fill="none" stroke="#8555b5" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="425" cy="626" r="6" fill="#8555b5"/>
<circle cx="1095" cy="626" r="6" fill="#8555b5"/>
