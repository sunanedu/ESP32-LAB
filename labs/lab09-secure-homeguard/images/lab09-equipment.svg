<text x="75" y="87" font-size="36" fill="#17283f" text-anchor="start" font-weight="bold">LAB 09 | S3 HomeGuard — ชุดอุปกรณ์</text>
<text x="75" y="132" font-size="23" fill="#52647a" text-anchor="start" font-weight="normal">ใช้ชุดเดิมจาก Lab07 เพิ่มปุ่มเปิดหน้าต่างจับคู่ ไม่ย้ายสาย และใช้ OLED SH1106G</text>
<text x="65" y="1118" font-size="23" fill="#52647a" text-anchor="start" font-weight="normal">อ่านชื่อ GPIO/สกรีนบนอุปกรณ์จริง • ภาพเป็นผังการเชื่อมต่อ ไม่ใช่ตำแหน่งขาบน header</text>
<rect x="65" y="250" width="450" height="590" rx="12" fill="#f0faf6" stroke="#bccbdb" stroke-width="2"/>
<text x="87" y="292" font-size="28" fill="#17283f" text-anchor="start" font-weight="bold">Android / React Native</text>
<text x="87" y="326" font-size="21" fill="#52647a" text-anchor="start" font-weight="normal">สัญลักษณ์อธิบาย ไม่ใช่ภาพถ่าย</text>
<text x="93" y="430" font-size="23" fill="#17283f" text-anchor="start" font-weight="normal">แอปชื่อ S3 HomeGuard</text>
