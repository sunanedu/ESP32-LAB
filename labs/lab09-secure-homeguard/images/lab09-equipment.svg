<rect x="65" y="945" width="1470" height="140" rx="12" fill="#f6f9fc" stroke="#dce6ef" stroke-width="2"/>
<text x="88" y="980" font-size="23" fill="#17283f" text-anchor="start" font-weight="normal">อุปกรณ์: USB data, บอร์ด S3, OLED128×64, DHT11, Relay2CH, ปุ่ม3พิน, โทรศัพท์ Android</text>
<text x="88" y="1016" font-size="23" fill="#17283f" text-anchor="start" font-weight="normal">จับคู่ครั้งแรกต้องอยู่ใกล้และกดปุ่มที่บอร์ด; มีสอง transport ไม่บังคับกล้อง</text>
<text x="88" y="1052" font-size="23" fill="#17283f" text-anchor="start" font-weight="normal">ไม่มีเว็บกลาง; คีย์อยู่ที่โทรศัพท์/ESP ส่วน broker ส่งต่อข้อความเข้ารหัส</text>
