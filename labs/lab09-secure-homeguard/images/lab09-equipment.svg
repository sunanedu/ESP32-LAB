<title>LAB 09 | S3 HomeGuard — ชุดอุปกรณ์</title><desc>ใช้ชุดเดิมจาก Lab07 เพิ่มปุ่มเปิดหน้าต่างจับคู่ ไม่ย้ายสาย และใช้ OLED SH1106G</desc>
<rect width="1600" height="1150" fill="#fff"/>
