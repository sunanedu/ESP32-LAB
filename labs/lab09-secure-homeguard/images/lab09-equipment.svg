<text x="93" y="600" font-size="23" fill="#17283f" text-anchor="start" font-weight="normal">BLE หรือ Wi-Fi SoftAP</text>
<text x="93" y="685" font-size="23" fill="#17283f" text-anchor="start" font-weight="normal">กรอกรหัสเอง / QR optional</text>
<rect x="575" y="250" width="450" height="590" rx="12" fill="#f0faf6" stroke="#bccbdb" stroke-width="2"/>
<text x="597" y="292" font-size="28" fill="#17283f" text-anchor="start" font-weight="bold">ESP32-S3 + OLED</text>
<text x="597" y="326" font-size="21" fill="#52647a" text-anchor="start" font-weight="normal">สัญลักษณ์อธิบาย ไม่ใช่ภาพถ่าย</text>
<text x="603" y="430" font-size="23" fill="#17283f" text-anchor="start" font-weight="normal">SH1106G SDA8 / SCL9</text>
<text x="603" y="515" font-size="23" fill="#17283f" text-anchor="start" font-weight="normal">DHT11 DATA4</text>
<text x="603" y="600" font-size="23" fill="#17283f" text-anchor="start" font-weight="normal">ปุ่มโมดูล OUT18</text>
<text x="603" y="685" font-size="23" fill="#17283f" text-anchor="start" font-weight="normal">Relay IN1=16 / IN2=17</text>
<rect x="1085" y="250" width="450" height="590" rx="12" fill="#f0faf6" stroke="#bccbdb" stroke-width="2"/>
<text x="1107" y="292" font-size="28" fill="#17283f" text-anchor="start" font-weight="bold">MQTT broker + MQTTX</text>
<text x="1107" y="326" font-size="21" fill="#52647a" text-anchor="start" font-weight="normal">สัญลักษณ์อธิบาย ไม่ใช่ภาพถ่าย</text>
<text x="1113" y="430" font-size="23" fill="#17283f" text-anchor="start" font-weight="normal">TLS / AES-GCM payload</text>
<text x="1113" y="515" font-size="23" fill="#17283f" text-anchor="start" font-weight="normal">EMQX public: ทดลองเท่านั้น</text>
