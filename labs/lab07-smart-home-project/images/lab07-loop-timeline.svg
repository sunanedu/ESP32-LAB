<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630">
  <rect width="1080" height="630" fill="#ffffff"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#475569"/></marker></defs>
  <g font-family="Tahoma, sans-serif" text-anchor="middle" fill="#0f172a">
    <text x="540" y="44" font-size="28" font-weight="bold">หนึ่งรอบ loop: ทำงานที่ถึงเวลา แล้วกลับมารับ MQTT</text>
    <g stroke="#64748b" stroke-width="2">
      <rect x="40" y="100" width="285" height="90" rx="12" fill="#eff6ff"/>
      <rect x="395" y="100" width="285" height="90" rx="12" fill="#eff6ff"/>
      <rect x="750" y="100" width="285" height="90" rx="12" fill="#dcfce7"/>
      <rect x="40" y="285" width="285" height="100" rx="12" fill="#fef3c7"/>
      <rect x="395" y="285" width="285" height="100" rx="12" fill="#fef3c7"/>
      <rect x="750" y="285" width="285" height="100" rx="12" fill="#fef3c7"/>
    </g>
    <g font-size="22">
      <text x="182" y="136">serviceWiFi()</text><text x="182" y="169">retry ทุก 10 s เมื่อหลุด</text>
      <text x="537" y="136">connectMqtt()</text><text x="537" y="169">retry ทุก 5 s เมื่อหลุด</text>
      <text x="892" y="136">mqtt.loop()</text><text x="892" y="169">packet → callback → GPIO</text>
      <text x="182" y="325">DHT ครบ 5 s?</text><text x="182" y="359">อ่าน / ตรวจ valid / JSON</text>
      <text x="537" y="325">OLED ครบ 1 s?</text><text x="537" y="359">วาดค่าที่เก็บ + อายุข้อมูล</text>
      <text x="892" y="325">State ครบ 10 s?</text><text x="892" y="359">publish Relay state ซ้ำ</text>
    </g>
    <g stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M325 145H390"/><path d="M680 145H745"/>
      <path d="M892 190V237H182V280"/>
      <path d="M325 335H390"/><path d="M680 335H745"/>
      <path d="M1035 335H1055V450H20V145H35"/>
    </g>
    <text x="540" y="500" font-size="23">ถ้ายังไม่ถึง timer ให้ข้ามงานนั้น ไม่ใช้ delay() รอ</text>
    <text x="540" y="546" font-size="21">อ่าน sensor กับวาดจอแยกกัน — จอไม่สั่งวัด DHT ซ้ำทุกครั้ง</text>
    <text x="540" y="590" font-size="20" fill="#b91c1c">connect / DHT / I2C ยังใช้เวลา: cooperative loop ไม่รับประกันเวลาตอบสนองตายตัว</text>
  </g>
</svg>
