<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="t d">
<title id="t">กลุ่มขาภายในปุ่ม 4 ขา</title><desc id="d">A1 A2 เป็นกลุ่มที่ต่อถึงกันตลอด B1 B2 เป็นอีกกลุ่ม กดแล้วจึงเชื่อม A กับ B; ต้องวัดคู่ขาของชิ้นจริง</desc><rect width="1200" height="450" fill="white"/>
<g font-family="Segoe UI,Noto Sans Thai,sans-serif" fill="#17202a">
<text x="600" y="43" text-anchor="middle" font-size="29" font-weight="bold">ปุ่ม 4 ขา: ตรวจกลุ่มขาด้วย continuity ก่อนต่อ</text>
<g stroke-width="6" fill="none"><path d="M330 130 V290 M330 210 H520" stroke="#2563eb"/><path d="M870 130 V290 M700 210 H870" stroke="#0f766e"/><path d="M520 210 L680 160" stroke="#d97706"/></g>
<g fill="#2563eb"><circle cx="330" cy="130" r="12"/><circle cx="330" cy="290" r="12"/></g><g fill="#0f766e"><circle cx="870" cy="130" r="12"/><circle cx="870" cy="290" r="12"/></g><circle cx="520" cy="210" r="8"/><circle cx="700" cy="210" r="8"/>
<g font-size="22"><text x="260" y="138">A1</text><text x="260" y="300">A2</text><text x="900" y="138">B1</text><text x="900" y="300">B2</text></g>
<text x="600" y="115" text-anchor="middle" font-size="20">กดแล้วเชื่อมกลุ่ม A กับ B</text><text x="160" y="240" text-anchor="middle" font-size="18">GPIO18 ไปกลุ่ม A</text><text x="1040" y="240" text-anchor="middle" font-size="18">GND ไปกลุ่ม B</text>
<text x="600" y="365" text-anchor="middle" font-size="21">A1↔A2 และ B1↔B2 ต่อถึงกันตลอด แม้ไม่กด</text>
<text x="600" y="412" text-anchor="middle" font-size="18">ภาพนี้เป็นผังไฟฟ้าเชิงแนวคิด ไม่ใช่ตำแหน่งขาทางกายภาพของปุ่มทุกรุ่น</text>
</g></svg>
