<text x="88" y="980" font-size="23" fill="#17283f" text-anchor="start" font-weight="normal">4.4 traffic test: common VCC → LOW = เปิด / HIGH = ดับ เป็นค่าเริ่มต้นที่ปรับได้</text>
<text x="88" y="1016" font-size="23" fill="#17283f" text-anchor="start" font-weight="normal">โมดูลนี้มี 4 สาย ไม่มีขา GND แยก: ช่องสีไหลกลับผ่าน GPIO เมื่อ LOW; ห้ามสลับ VCC เป็น GND</text>
<text x="88" y="1052" font-size="23" fill="#17283f" text-anchor="start" font-weight="normal">ต้องยืนยัน R/กระแสต่อช่องก่อนต่อ GPIO; ถ้าเป็นรุ่น 5V หรือกระแสเกิน ให้ใช้วงจรขับตามรุ่น</text>
