<text x="88" y="980" font-size="23" fill="#17283f" text-anchor="start" font-weight="normal">อ่านสกรีนจริง: ลำดับ VCC/DATA/GND ของ DHT และ GND/VCC/SCL/SDA ของ OLED ต่างกันได้</text>
<text x="88" y="1016" font-size="23" fill="#17283f" text-anchor="start" font-weight="normal">DHT11 เปล่า 4 ขา: มองด้านตะแกรง ขาชี้ลง → 1 VCC / 2 DATA / 3 NC ไม่ต่อ / 4 GND</text>
<text x="88" y="1052" font-size="23" fill="#17283f" text-anchor="start" font-weight="normal">DHT DATA ต้องมี pull-up 10kΩ ไป 3V3 ถ้าโมดูลไม่มีในตัว • คง SDA8/SCL9 และ DATA4 ไปใช้ใน Lab07</text>
