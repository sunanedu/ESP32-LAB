<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">ตรวจ COM port ใน Device Manager</title><desc id="desc">หน้าจอจำลอง Windows Device Manager แสดง Silicon Labs CP210x USB to UART Bridge ที่ COM5</desc>
  <defs><style>.t{font-family:'Segoe UI','Noto Sans Thai',sans-serif;fill:#1f2933}.h{font-size:30px;font-weight:700}.m{font-size:22px}.s{font-size:18px}.ui{fill:#fff;stroke:#9fb3c8;stroke-width:2}</style></defs>
  <rect width="1200" height="675" fill="#fff"/><text x="600" y="48" text-anchor="middle" class="t h">ขยาย Ports แล้วอ่านหมายเลขในวงเล็บท้ายชื่อ</text>
  <rect x="70" y="80" width="1060" height="475" class="ui"/>
  <rect x="71" y="81" width="1058" height="40" fill="#f3f3f3"/><text x="92" y="108" class="t s">Device Manager</text><text x="1000" y="108" class="t s">—   □   ×</text>
  <text x="92" y="150" class="t s">File     Action     View     Help</text><line x1="71" y1="168" x2="1129" y2="168" stroke="#d1d5db"/>
  <g class="t m"><text x="92" y="205">⌄  ESP32-LAB-PC</text><text x="125" y="245">›  Audio inputs and outputs</text><text x="125" y="285">›  Bluetooth</text><text x="125" y="325">›  Network adapters</text><text x="125" y="365">⌄  Ports (COM &amp; LPT)</text></g>
  <rect x="159" y="381" width="880" height="42" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="180" y="410" class="t m">Silicon Labs CP210x USB to UART Bridge (COM5)</text>
  <text x="125" y="465" class="t m">›  Processors</text><text x="125" y="505" class="t m">›  Universal Serial Bus controllers</text>
  <rect x="70" y="575" width="1060" height="72" rx="8" fill="#fef3c7"/><text x="95" y="605" class="t s">ภาพจำลองเพื่อการสอน • COM5 เป็นตัวอย่าง ไม่ใช่ผลตรวจของเครื่องผู้เรียน</text><text x="95" y="633" class="t s">จดชื่ออุปกรณ์และ COM ที่เพิ่มขึ้นเมื่อเสียบบอร์ด แล้วเลือก Port เดียวกันใน Arduino IDE</text>
</svg>
