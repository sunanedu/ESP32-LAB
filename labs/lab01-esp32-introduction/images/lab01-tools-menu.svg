<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">ตั้งค่า Tools menu สำหรับ ESP32 Dev Module</title><desc id="desc">หน้าจอจำลองเมนู Tools ของ Arduino IDE แสดง Board, Port, Upload Speed, Flash Size และ Partition Scheme</desc>
  <defs><style>.t{font-family:'Segoe UI','Noto Sans Thai',sans-serif;fill:#1f2933}.h{font-size:30px;font-weight:700}.m{font-size:20px}.s{font-size:17px}.menu{fill:#fff;stroke:#9fb3c8;stroke-width:2}.ok{fill:#d9f2ec}</style></defs>
  <rect width="1200" height="675" fill="#edf6f7"/><text x="600" y="48" text-anchor="middle" class="t h">Arduino IDE → Tools: ค่าที่ใช้ใน Lab 01</text>
  <rect x="80" y="82" width="1040" height="500" rx="10" fill="#fff" stroke="#9fb3c8" stroke-width="2"/><rect x="80" y="82" width="1040" height="48" rx="10" fill="#008184"/><text x="110" y="113" fill="white" class="m">File&#160;&#160; Edit&#160;&#160; Sketch&#160;&#160; Tools&#160;&#160; Help</text>
  <rect x="255" y="130" width="680" height="420" class="menu"/><g class="t m"><rect x="270" y="148" width="650" height="48" class="ok"/><text x="292" y="179">Board: “ESP32 Dev Module”</text><text x="890" y="179">✓</text><rect x="270" y="202" width="650" height="48" class="ok"/><text x="292" y="233">Port: “COM5”</text><text x="890" y="233">✓</text><line x1="270" y1="263" x2="920" y2="263" stroke="#d9e2ec"/><text x="292" y="298">Upload Speed: “921600”</text><text x="292" y="343">CPU Frequency: “240MHz (WiFi/BT)”</text><text x="292" y="388">Flash Frequency: “80MHz”</text><text x="292" y="433">Flash Size: “4MB (32Mb)”</text><text x="292" y="478">Partition Scheme: “Default 4MB with spiffs”</text><text x="292" y="523">Core Debug Level: “None”</text></g>
