<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">ผลลัพธ์ Serial Monitor ของ chip info</title><desc id="desc">หน้าจอจำลอง Arduino IDE Serial Monitor ที่ 115200 baud แสดงข้อมูล ESP32 รุ่น revision core ความถี่ Flash MAC และ free heap</desc>
  <defs><style>.t{font-family:'Segoe UI','Noto Sans Thai',sans-serif}.h{font-size:30px;font-weight:700;fill:#102a43}.m{font-size:18px;fill:#d9e2ec}.ui{fill:#fff;stroke:#9fb3c8;stroke-width:2}</style></defs>
  <rect width="1200" height="675" fill="#eef4f8"/><text x="600" y="48" text-anchor="middle" class="t h">Serial Monitor: ผลลัพธ์หลังอัปโหลด</text>
  <rect x="80" y="80" width="1040" height="515" rx="10" class="ui"/><rect x="80" y="80" width="1040" height="48" rx="10" fill="#008184"/><text x="110" y="112" fill="white" class="t" font-size="19">lab01_chip_info.ino — Arduino IDE</text>
  <rect x="105" y="150" width="990" height="350" rx="6" fill="#17202a"/><g class="t m"><text x="130" y="188">=== ESP32 Chip Information ===</text><text x="130" y="225">[CHIP] Model            : ESP32-D0WDQ6</text><text x="130" y="262">[CHIP] Revision         : 3</text><text x="130" y="299">[CHIP] CPU cores        : 2</text><text x="130" y="336">[CHIP] CPU frequency    : 240 MHz</text><text x="130" y="373">[CHIP] Flash size       : 4 MB</text><text x="130" y="410">[CHIP] Wi-Fi STA MAC    : 24:6F:28:12:34:56</text><text x="130" y="447">[CHIP] Free heap        : 327680 bytes</text><text x="130" y="484">=== Ready ===</text></g>
  <rect x="105" y="520" width="570" height="45" rx="5" fill="#f5f7fa" stroke="#9fb3c8"/><text x="125" y="550" class="t" fill="#52606d" font-size="17">Message (Enter to send message to 'ESP32 Dev Module')</text><rect x="845" y="520" width="115" height="45" rx="5" fill="#f5f7fa" stroke="#9fb3c8"/><text x="902" y="550" text-anchor="middle" class="t" fill="#102a43" font-size="18">New Line</text><rect x="970" y="520" width="125" height="45" rx="5" fill="#d9f2ec" stroke="#27ab83"/><text x="1032" y="550" text-anchor="middle" class="t" fill="#102a43" font-size="18">115200 baud</text>
  <text x="600" y="640" text-anchor="middle" class="t" fill="#102a43" font-size="20">ค่ารุ่นชิป, revision, MAC และ heap ของบอร์ดแต่ละตัวอาจต่างจากภาพ</text>
</svg>
