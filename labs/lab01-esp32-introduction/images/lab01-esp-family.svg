<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">ภาพรวมตระกูล ESP สำหรับเลือกใช้งาน</title><desc id="desc">การ์ดเปรียบเทียบ ESP8266, ESP32, ESP32-S2, S3, C3, C6, H2 และ P4 ตาม CPU และการเชื่อมต่อ</desc>
  <defs><style>.t{font-family:'Segoe UI','Noto Sans Thai',sans-serif;fill:#102a43}.h{font-size:32px;font-weight:700}.n{font-size:23px;font-weight:700}.s{font-size:16px}.card{stroke:#829ab1;stroke-width:2}.wifi{fill:#d9f2ec}.ble{fill:#e5dbff}.radio{fill:#fff3cd}.compute{fill:#d9eaf7}</style></defs>
  <rect width="1200" height="675" fill="#f5f9fc"/><text x="600" y="48" text-anchor="middle" class="t h">ตระกูล ESP: เลือกให้ตรงกับการเชื่อมต่อและงานประมวลผล</text>
  <g transform="translate(45 85)"><rect width="255" height="220" rx="16" class="card wifi"/><text x="128" y="42" text-anchor="middle" class="t n">ESP8266</text><text x="22" y="82" class="t s">CPU: Xtensa, 1 core</text><text x="22" y="112" class="t s">Wi-Fi 2.4 GHz</text><text x="22" y="142" class="t s">ไม่มี Bluetooth</text><text x="22" y="188" class="t s">งาน Wi-Fi IoT พื้นฐาน</text></g>
  <g transform="translate(330 85)"><rect width="255" height="220" rx="16" class="card ble"/><text x="128" y="42" text-anchor="middle" class="t n">ESP32</text><text x="22" y="82" class="t s">CPU: Xtensa, 2 core</text><text x="22" y="112" class="t s">Wi-Fi 2.4 GHz</text><text x="22" y="142" class="t s">Classic BT + BLE</text><text x="22" y="188" class="t s">รุ่นที่ใช้ในคอร์สนี้</text></g>
  <g transform="translate(615 85)"><rect width="255" height="220" rx="16" class="card wifi"/><text x="128" y="42" text-anchor="middle" class="t n">ESP32-S2</text><text x="22" y="82" class="t s">CPU: Xtensa, 1 core</text><text x="22" y="112" class="t s">Wi-Fi 2.4 GHz</text><text x="22" y="142" class="t s">Native USB, ไม่มี BT</text><text x="22" y="188" class="t s">USB device / security</text></g>
  <g transform="translate(900 85)"><rect width="255" height="220" rx="16" class="card ble"/><text x="128" y="42" text-anchor="middle" class="t n">ESP32-S3</text><text x="22" y="82" class="t s">CPU: Xtensa, 2 core</text><text x="22" y="112" class="t s">Wi-Fi + BLE 5</text><text x="22" y="142" class="t s">Native USB + vector</text><text x="22" y="188" class="t s">AIoT / HMI / USB</text></g>
  <g transform="translate(45 340)"><rect width="255" height="220" rx="16" class="card ble"/><text x="128" y="42" text-anchor="middle" class="t n">ESP32-C3</text><text x="22" y="82" class="t s">CPU: RISC-V, 1 core</text><text x="22" y="112" class="t s">Wi-Fi + BLE 5</text><text x="22" y="142" class="t s">ขนาดเล็ก ประหยัดพลังงาน</text><text x="22" y="188" class="t s">IoT ปริมาณมาก</text></g>
  <g transform="translate(330 340)"><rect width="255" height="220" rx="16" class="card radio"/><text x="128" y="42" text-anchor="middle" class="t n">ESP32-C6</text><text x="22" y="82" class="t s">CPU: RISC-V + LP</text><text x="22" y="112" class="t s">Wi-Fi 6 + BLE 5</text><text x="22" y="142" class="t s">Thread / Zigbee</text><text x="22" y="188" class="t s">Matter multi-protocol</text></g>
  <g transform="translate(615 340)"><rect width="255" height="220" rx="16" class="card radio"/><text x="128" y="42" text-anchor="middle" class="t n">ESP32-H2</text><text x="22" y="82" class="t s">CPU: RISC-V + LP</text><text x="22" y="112" class="t s">BLE 5 + 802.15.4</text><text x="22" y="142" class="t s">ไม่มี Wi-Fi</text><text x="22" y="188" class="t s">Thread / Zigbee node</text></g>
  <g transform="translate(900 340)"><rect width="255" height="220" rx="16" class="card compute"/><text x="128" y="42" text-anchor="middle" class="t n">ESP32-P4</text><text x="22" y="82" class="t s">CPU: RISC-V, 2 core + LP</text><text x="22" y="112" class="t s">ไม่มี radio ในตัว</text><text x="22" y="142" class="t s">ประมวลผลสูง / MIPI</text><text x="22" y="188" class="t s">HMI / vision</text></g>
  <text x="600" y="625" text-anchor="middle" class="t s">คุณสมบัติและ memory ต่างกันตามรุ่นย่อย — ตรวจ Product Selector และ datasheet ก่อนออกแบบจริง</text>
</svg>
